name: Bootstrap repository payload

on:
  push:
    paths:
      - ".bootstrap/**"
      - ".github/workflows/bootstrap.yml"

permissions:
  contents: write

jobs:
  unpack:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wait for complete payload
        id: payload
        shell: bash
        run: |
          expected=8
          count=$(find .bootstrap -maxdepth 1 -type f -name 'chunk_*' 2>/dev/null | wc -l)
          echo "Found $count/$expected chunks"
          if [ "$count" -ne "$expected" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - name: Reconstruct repository
        if: steps.payload.outputs.ready == 'true'
        shell: bash
        run: |
          cat .bootstrap/chunk_* > /tmp/repo.tar.gz.b64
          base64 -d /tmp/repo.tar.gz.b64 > /tmp/repo.tar.gz
          echo "0cd629962d5695a5fd5a239a2559445ab482d6cf21811ab222b0b957fd49b1da  /tmp/repo.tar.gz" | sha256sum -c -
          tar -xzf /tmp/repo.tar.gz
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: publish Z-Mod-native camera manager baseline"
          git push
