name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate
        run: |
          python3 -m py_compile app.py drivers/ov3660_orientation.py
          sh -n install.sh update.sh uninstall.sh camera-manager.sh
          python3 -m unittest discover -s tests -v
      - name: Build release archive
        run: |
          NAME="ad5x-camera-manager-${GITHUB_REF_NAME}.zip"
          zip -r "$NAME" . \
            -x '.git/*' '.github/*' '__pycache__/*' '*.pyc'
          sha256sum "$NAME" > SHA256SUMS
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NAME="ad5x-camera-manager-${GITHUB_REF_NAME}.zip"
          gh release create "$GITHUB_REF_NAME" "$NAME" SHA256SUMS \
            --generate-notes \
            --title "AD5X Camera Manager ${GITHUB_REF_NAME}"
