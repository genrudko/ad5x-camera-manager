# AD5X Camera Manager — Z-Mod plugin integration.
# Managed source: https://github.com/genrudko/ad5x-camera-manager
# Runtime state lives outside the git checkout in mod_data/ad5x_camera_manager.

[gcode_shell_command camera_manager]
command: /usr/data/config/mod_data/ad5x_camera_manager/camera-manager.sh
timeout: 60
verbose: True

[delayed_gcode CAMERA_MANAGER_AUTOSTART]
initial_duration: 5
gcode:
    RUN_SHELL_COMMAND CMD=camera_manager PARAMS="start"

[gcode_macro CAMERA_STATUS]
description: Camera Manager status
gcode:
    RUN_SHELL_COMMAND CMD=camera_manager PARAMS="status"

[gcode_macro CAMERA_RESTART]
description: Restart one camera: CAMERA_RESTART ID=stock
gcode:
    {% set id = params.ID|default("stock")|string %}
    RUN_SHELL_COMMAND CMD=camera_manager PARAMS="camera-restart {id}"

[gcode_macro CAMERA_ON]
description: Enable/start one camera: CAMERA_ON ID=stock
gcode:
    {% set id = params.ID|default("stock")|string %}
    RUN_SHELL_COMMAND CMD=camera_manager PARAMS="on {id}"

[gcode_macro CAMERA_OFF]
description: Disable/stop one camera: CAMERA_OFF ID=stock
gcode:
    {% set id = params.ID|default("stock")|string %}
    RUN_SHELL_COMMAND CMD=camera_manager PARAMS="off {id}"

[gcode_macro CAMERA_PRIMARY]
description: Make camera primary on port 8080: CAMERA_PRIMARY ID=stock
gcode:
    {% set id = params.ID|default("stock")|string %}
    RUN_SHELL_COMMAND CMD=camera_manager PARAMS="primary {id}"

[gcode_macro CAMERA_MANAGER_UI]
description: Camera Manager web UI / Fluidd HTTP Page
gcode:
    RUN_SHELL_COMMAND CMD=camera_manager PARAMS="ui"
